<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space — CalmKitchen Designer</title>
<link rel="stylesheet" href="studio.css">
<style>
  .room { fill: rgba(12,30,3,0.03); stroke: #1b3a36; stroke-width: 2.5; }
  .guide { stroke: rgba(12,30,3,0.16); stroke-width: 1; stroke-dasharray: 2 6; }
  .edge-label { font-family: var(--font-mono); font-size: 9.5px; fill: var(--text-low); }
  .vertex { fill: var(--bg-canvas); stroke: rgba(12,30,3,0.45); stroke-width: 1.6; }
  .vertex.selected { fill: var(--accent); stroke: #fbfaf5; }
  .dim { stroke: var(--accent); stroke-width: 1.1; }
  .dim-label { font-family: var(--font-mono); font-size: 10px; fill: var(--accent); }
  .opening { stroke-width: 5; }
  .op-label { font-family: var(--font-mono); font-size: 8.5px; }
  .room-panel { top: 56px; right: 12px; bottom: 60px; width: 300px; }
  .v-row { display: grid; grid-template-columns: 18px 1fr 62px 62px; align-items: center; gap: 6px; padding: 5px 8px; border-radius: var(--r-sm); color: var(--text-low); }
  .v-row:hover { background: var(--bg-hover); }
  .v-row .idx { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .v-row .xy { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); text-align: right; }
  .v-row .grip { color: var(--text-faint); font-size: 11px; }
  .v-row.selected { background: var(--accent-soft); }
  .v-row.selected .idx, .v-row.selected .xy { color: var(--text-hi); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 214.2 214.2" aria-hidden="true"><path fill="#b1d15b" d="M190.1,0l-27.9,45.9c-3.5,5.7-9.8,9.4-16.6,9.4h-76.8c-6.8,0-13.3-3.7-16.8-9.4L24.4,0H0v214.2h24.4l27.7-45.6c3.5-5.9,10-9.4,16.8-9.4h76.8c6.8,0,13.1,3.5,16.6,9.4l27.9,45.6h24.2V0h-24.2ZM133,133.2h-51.9v-51.8h51.9v51.8Z"/></svg>
      <span class="brand-name">CalmKitchen <em>Designer</em></span>
    </div>
    <button class="project-btn">Kitchen 1 <span class="save-dot" title="Saved"></span><span class="chev">▾</span></button>
    <nav class="stepper" aria-label="Workflow stages">
      <button class="step active"><span class="dot">1</span>Space</button>
      <span class="step-sep"></span>
      <button class="step"><span class="dot">2</span>Fit-out</button>
      <span class="step-sep"></span>
      <button class="step"><span class="dot">3</span>Simulate</button>
    </nav>
    <div class="topbar-spacer"></div>
    <button class="cmdk">Search or run a command…<span class="kbd">⌘K</span></button>
    <div class="seg" aria-label="View mode">
      <button aria-pressed="true">Plan</button>
      <button>3D</button>
      <button>Split</button>
    </div>
    <button class="iconbtn" title="Save state">⇩</button>
  </header>

  <main class="stage vignette" aria-label="Room definition workspace">
    <!-- ============ room svg (editing) ============ -->
    <svg style="position:absolute; inset:0; width:100%; height:100%;" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid meet" aria-label="Room outline with editable vertices">
      <!-- dashed guides through selected vertex -->
      <line class="guide" x1="0" y1="345" x2="1440" y2="345"/>
      <line class="guide" x1="600" y1="0" x2="600" y2="860"/>

      <!-- room -->
      <polygon class="room" points="480,150 1020,150 1020,360 900,360 900,710 480,710 480,600 420,600 420,240 480,240"/>

      <!-- edge length labels -->
      <text class="edge-label" x="748" y="141" text-anchor="middle">4 100</text>
      <text class="edge-label" x="1036" y="258" >1 450</text>
      <text class="edge-label" x="964" y="356" >830</text>
      <text class="edge-label" x="912" y="540" text-anchor="end" transform="rotate(-90 912 540)">2 330</text>
      <text class="edge-label" x="690" y="724" text-anchor="middle">2 780</text>
      <text class="edge-label" x="452" y="648" text-anchor="end">550</text>
      <text class="edge-label" x="410" y="424" text-anchor="end" transform="rotate(-90 410 424)">2 550</text>

      <!-- openings -->
      <line class="opening" x1="600" y1="150" x2="730" y2="150" stroke="#4b7ce1"/>
      <text class="op-label" x="665" y="136" text-anchor="middle" fill="#4b7ce1">clean pass 900</text>
      <line class="opening" x1="1020" y1="230" x2="1020" y2="330" stroke="#c2934f"/>
      <text class="op-label" x="1034" y="284" fill="#c2934f">dirty return 680</text>
      <line class="opening" x1="420" y1="430" x2="420" y2="510" stroke="#2d7c6f"/>
      <text class="op-label" x="404" y="474" text-anchor="end" fill="#2d7c6f">staff D2 550</text>

      <!-- pillar (locked) -->
      <rect x="856" y="392" width="18" height="18" fill="none" stroke="rgba(12,30,3,0.42)" stroke-width="1.3"/>
      <text class="op-label" x="886" y="405" fill="var(--text-low)">pillar ⚿</text>

      <!-- vertices -->
      <rect class="vertex" x="474" y="144" width="12" height="12" rx="2"/>
      <rect class="vertex" x="1014" y="144" width="12" height="12" rx="2"/>
      <rect class="vertex" x="1014" y="354" width="12" height="12" rx="2"/>
      <rect class="vertex" x="894" y="354" width="12" height="12" rx="2"/>
      <rect class="vertex" x="894" y="704" width="12" height="12" rx="2"/>
      <rect class="vertex" x="474" y="704" width="12" height="12" rx="2"/>
      <rect class="vertex" x="474" y="594" width="12" height="12" rx="2"/>
      <rect class="vertex" x="414" y="594" width="12" height="12" rx="2"/>
      <rect class="vertex selected" x="592" y="337" width="16" height="16" rx="3"/>

      <!-- selected vertex dimension lines -->
      <line class="dim" x1="600" y1="150" x2="600" y2="345"/>
      <text class="dim-label" x="610" y="250">1 850</text>
      <line class="dim" x1="480" y1="345" x2="600" y2="345"/>
      <text class="dim-label" x="540" y="335" text-anchor="middle">700</text>
      <text x="648" y="332" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent)">drag vertex · snap 100 mm</text>
    </svg>

    <!-- ============ tools rail ============ -->
    <nav class="rail" aria-label="Room tools">
      <button class="iconbtn active" title="Select / move (V)">▤</button>
      <button class="iconbtn" title="Draw wall (W)">⌐</button>
      <button class="iconbtn" title="Add opening (O)">⌠</button>
      <button class="iconbtn" title="Add pillar (P)">▣</button>
      <button class="iconbtn" title="Trace sketch (T)">⌗</button>
      <span class="rail-tip">Tools · T</span>
    </nav>

    <!-- ============ room panel ============ -->
    <aside class="panel room-panel" aria-label="Room settings">
      <div class="panel-head">
        <span class="panel-title">Room · Kitchen 1</span>
        <span class="badge accent mono">Rev 3</span>
      </div>
      <div class="panel-body">
        <div class="kv"><span>Floor area</span><span class="v">25.9 m²</span></div>
        <div class="kv"><span>Perimeter</span><span class="v">21.4 m</span></div>
        <div class="kv"><span>Vertices</span><span class="v">9</span></div>

        <div class="sect">
          <div class="sect-head"><h4>Vertices</h4><span class="panel-sub mono">v5 selected</span></div>
          <div class="v-row"><span class="idx">v1</span><span class="grip">⠿</span><span class="xy">670</span><span class="xy">0</span></div>
          <div class="v-row"><span class="idx">v2</span><span class="grip">⠿</span><span class="xy">6670</span><span class="xy">0</span></div>
          <div class="v-row selected"><span class="idx">v5</span><span class="grip">⠿</span><span class="xy">5330</span><span class="xy">2330</span></div>
          <div class="v-row"><span class="idx">v6</span><span class="grip">⠿</span><span class="xy">5330</span><span class="xy">6220</span></div>
          <div class="v-row"><span class="idx">v7</span><span class="grip">⠿</span><span class="xy">670</span><span class="xy">6220</span></div>
          <div class="v-row"><span class="idx">+4</span><span></span><span class="xy" style="color:var(--text-faint);">…</span><span class="xy"></span></div>
        </div>

        <div class="sect">
          <div class="sect-head collapsible"><h4>Openings &amp; pillars</h4><span class="panel-sub">3 openings · 1 pillar ›</span></div>
        </div>
        <div class="sect">
          <div class="sect-head collapsible"><h4>Trace from drawing</h4><span class="panel-sub">sketch-v3.jpg ›</span></div>
        </div>
      </div>
      <div style="display:grid; gap:8px; padding: 10px 12px; border-top: 1px solid var(--line-subtle);">
        <button class="btn btn-primary">Approve room →</button>
        <button class="btn btn-outline">Refine edges</button>
      </div>
    </aside>

    <!-- ============ status pill ============ -->
    <div class="statuspill" role="status">
      <span class="grp"><span class="ok">✓</span>room closed</span>
      <span class="sep"></span>
      <span class="grp"><span class="warn">▲</span><span class="n">2</span> checks</span>
      <span class="sep"></span>
      <button class="mini-btn">Review</button>
    </div>

    <!-- ============ zoom cluster ============ -->
    <div class="zoomcluster" aria-label="Zoom">
      <button class="iconbtn">−</button>
      <span class="pct">100%</span>
      <button class="iconbtn">＋</button>
      <button class="iconbtn" title="Fit to screen">⛶</button>
    </div>
  </main>
</div>
</body>
</html>
